    function dueBadge(r){
      if(r.kind!=='expense')return '';
      const due=new Date(r.date+'T12:00:00');
      if(Number.isNaN(due.getTime()))return '';
      const now=new Date(),todayDate=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);
      const days=Math.round((due-todayDate)/86400000);
      let tone,label;
      if(r.status==='pago'){tone='paid';label='Pago'}
      else if(days<0){tone='overdue';label='Vencido há '+Math.abs(days)+' dia'+(Math.abs(days)===1?'':'s')}
      else if(days===0){tone='today';label='Vence hoje'}
      else if(days<=3){tone='soon';label='Vence em '+days+' dia'+(days===1?'':'s')}
      else if(days<=7){tone='upcoming';label='Vence em '+days+' dias'}
      else{tone='normal';label='Vence em '+days+' dias'}
      return '<span class="due-badge due-'+tone+'" title="Vencimento: '+esc(r.date.split('-').reverse().join('/'))+'">'+(tone==='paid'?'✓ ':'')+label+'</span>';

    function chartSVG(months){
      const points=months.map(m=>balanceThrough(m)??0),W=800,H=230,padTop=20,padBottom=34,padLeft=30,padRight=12;const min=Math.min(0,...points),max=Math.max(0,...points);const spread=max-min||1;const nice=spread*.13;const lo=min-nice,hi=max+nice;const x=i=>padLeft+i*(W-padLeft-padRight)/Math.max(months.length-1,1);const y=v=>padTop+(hi-v)/(hi-lo)*(H-padTop-padBottom);

    function cardCommittedLimit(card,month){
      let committed=0;
      for(const entry of data.entries){
        if(entry.method!=='credit'||entry.cardId!==card.id)continue;
        const start=firstInvoice(entry,card);
        if(entry.repeat==='monthly')continue;
        const total=entry.repeat==='installments'?entry.installments:1;
        for(let i=Math.max(0,monthsBetween(start,month));i<total;i++){
          const dueMonth=addMonth(start,i);
          if(data.paidInvoices[`${card.id}|${dueMonth}`]||data.entryStatuses?.[`${entry.id}|${dueMonth}`]==='pago')continue;
          committed+=entry.repeat==='installments'?installmentValue(entry.amount,i,total):entry.amount;
        }
      }
      return Math.round(committed*100)/100;
    }

    function installmentSummary(){

utton></div></section><section class="panel"><div class="panel-header"><div><h2>Como são calculadas as faturas</h2><p>Previsão transparente e editável</p></div>${icon('info',20)}</div><div class="tips"><strong>Primeira fatura:</strong> no mês do registro por padrão, ou escolhida manualmente.<br><strong>Parcelas:</strong> aparecem mês a mês, começando na primeira fatura definida.<br><strong>Saldo total:</strong> soma dos saldos das contas, já considerando faturas previstas.</div></section></div><section class="panel section-space"><div class="panel-header"><div><h2>Suas categorias</h2><p>Crie, renomeie e adicione imagens personalizadas a receitas e despesas.</p></div><button class="button primary small" data-action="add-category">${icon('plus',15)} Nova categoria</button></div><div class="split-heading"><h2 style="font-size:14px">Despesas</h2><span class="badge-count">${data.categories.filter(c=>c.kind==='expense').length}</span></div><div class="category-list">${data.categories.filter(c=>c.kind==='expense').map(categoryHTML).join('')}</div><div class="split-heading"><h2 style="font-size:14px">Receitas</h2><span class="badge-count">${data.categories.filter(c=>c.kind==='income').length}</span></div><div class="category-list">${data.categories.filter(c=>c.kind==='income').map(categoryHTML).join('')}</div></section>`}

    function parseBankCSV(text){
      const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw Error('CSV sem movimentações.');if(lines.length>3001)throw Error('Limite de 3.000 linhas por arquivo.');
      const delimiter=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
      function cells(line){const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&quoted&&line[i+1]==='"'){cur+='"';i++}else if(c==='"')quoted=!quoted;else if(c===delimiter&&!quoted){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out}
      const headers=cells(lines[0]).map(x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim());
      const col=(names)=>headers.findIndex(h=>names.includes(h));
      const di=col(['data','date','data lancamento','data da transacao']),de=col(['descricao','description','historico','estabelecimento','detalhes','origem / destino','origem/destino']),va=col(['valor','amount','value']),ti=col(['tipo','type']),ho=col(['hora','time']),me=col(['forma de pagamento','metodo de pagamento']);
      if(di<0||de<0||va<0)throw Error('O CSV precisa ter colunas Data, Descrição e Valor.');
      const results=[];
      for(const line of lines.slice(1)){const row=cells(line);let date=(row[di]||'').trim();if(/^\d{2}\/\d{2}\/\d{4}$/.test(date))date=date.slice(6)+'-'+date.slice(3,5)+'-'+date.slice(0,2);if(!dateRE.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime()))continue;
        const description=(row[de]||'').trim().slice(0,120),raw=(row[va]||'').replace(/R\$|\s/g,'').replace(/[−–—]/g,'-');const neg=raw.startsWith('-')||/^\(.*\)$/.test(raw);const clean=raw.replace(/[()\-+]/g,'');const amount=parseBRL(clean)*(neg?-1:1);if(!description||!Number.isFinite(amount)||amount===0||Math.abs(amount)>1e12)continue;
        results.push({date,description,amount:Math.round(amount*100)/100,bankType:ti>=0?(row[ti]||'').slice(0,80):'',bankTime:ho>=0?(row[ho]||'').slice(0,8):'',bankMethod:me>=0?(row[me]||'').slice(0,80):''})}
      return results;
    }

    async function readIcon(file){
      if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024)throw Error('Escolha um PNG, JPG ou WebP de até 2 MB.');
      let bitmap;
      if(typeof createImageBitmap==='function')bitmap=await createImageBitmap(file);
      else bitmap=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Imagem inválida.'))};img.src=url});
      const canvas=document.createElement('canvas');canvas.width=128;canvas.height=128;
      const ctx=canvas.getContext('2d');const size=Math.min(128/bitmap.width,128/bitmap.height);const w=Math.max(1,Math.round(bitmap.width*size)),h=Math.max(1,Math.round(bitmap.height*size));
      ctx.clearRect(0,0,128,128);ctx.drawImage(bitmap,(128-w)/2,(128-h)/2,w,h);bitmap.close?.();
      const uri=canvas.toDataURL('image/png');if(!safeImage(uri))throw Error('Não foi possível processar essa imagem.');return uri;
    }

        if(f.method==='credit'&&f.invoiceMode==='manual'&&(!monthRE.test(f.firstInvoiceMonth)||f.firstInvoiceMonth<ym(f.date))){toast('A primeira fatura deve ser igual ou posterior ao mês da compra.');return}
        const accountId=data.accounts.some(a=>a.id===f.accountId)?f.accountId:data.accounts[0].id;
        const record={id:editId||uid(),description:f.description.trim(),kind:f.kind,amount,date:f.date,category:category.name,categoryId:category.id,method:f.method,accountId,cardId:f.method==='credit'?f.cardId:null,repeat:f.repeat,installments:f.repeat==='installments'?Number(f.installments):1,endMonth:f.repeat==='monthly'?(f.endMonth||null):null,invoiceMode:f.method==='credit'&&f.invoiceMode==='manual'?'manual':'auto',firstInvoiceMonth:f.method==='credit'&&f.invoiceMode==='manual'?f.firstInvoiceMonth:null};
        if(!record.description||!dateRE.test(record.date)||!Number.isInteger(record.installments)||record.installments<1||record.installments>MAX_PARCELAS){toast('Revise os campos do lançamento.');return}
        if(editId){const idx=data.entries.findIndex(r=>r.id===editId);if(idx<0)return;const previous=data.entries[idx];if(previous.repeat==='monthly'&&f.editSeries!=='yes'&&record.description===previous.description&&record.kind===previous.kind&&record.categoryId===previous.categoryId&&record.method===previous.method&&record.accountId===previous.accountId&&record.cardId===previous.cardId&&record.repeat===previous.repeat&&record.date===previous.date&&record.endMonth===previous.endMonth&&record.invoiceMode===previous.invoiceMode&&record.firstInvoiceMonth===previous.firstInvoiceMonth){
          const updated={...previous,monthAmounts:{...(previous.monthAmounts||{})}};
          if(Math.abs(amount-previous.amount)<0.005)delete updated.monthAmounts[selectedMonth];
          else updated.monthAmounts[selectedMonth]=amount;
          data.entries[idx]=updated;
          dialog.close();refresh();toast('Valor alterado somente em '+monthLabel(selectedMonth)+'.');return;
        }
        record.monthAmounts=previous.repeat==='monthly'&&record.repeat==='monthly'?(previous.monthAmounts||{}):{};
        data.entries[idx]=record
        }else{record.monthAmounts={};data.entries.push(record);data.lastEntryAddedAt=new Date().toISOString();}
        dialog.close();refresh();toast(editId?'Lançamento atualizado.':'Lançamento adicionado.')
      }else if(form.id==='card-form'){
        const c={id:editId||uid(),name:f.name.trim(),brand:f.brand,limit:Math.round(Number(f.limit)*100)/100,closingDay:Number(f.closingDay),dueDay:Number(f.dueDay),color:f.color,payAccountId:f.payAccountId,image:safeImage(dialog.dataset.iconData)};
        if(!c.name||!Number.isFinite(c.limit)||c.limit<0||![c.closingDay,c.dueDay].every(n=>Number.isInteger(n)&&n>=1&&n<=31)||!data.accounts.some(a=>a.id===c.payAccountId)){toast('Revise os dados do cartão.');return}
        if(editId){const idx=data.cards.findIndex(r=>r.id===editId);if(idx<0)return;data.cards[idx]=c}else data.cards.push(c);
        dialog.close();refresh();toast(editId?'Cartão atualizado.':'Cartão cadastrado.')
      }else if(form.id==='account-form'){
        const amount=Math.round(Number(f.openingBalance)*100)/100;if(!f.name?.trim()||!Number.isFinite(amount)||Math.abs(amount)>1e12){toast('Revise os dados da conta.');return}
        const a={id:editId||uid(),name:f.name.trim().slice(0,80),openingBalance:amount,image:safeImage(dialog.dataset.iconData)};
        if(editId){const idx=data.accounts.findIndex(x=>x.id===editId);if(idx<0)return;data.accounts[idx]=a}else data.accounts.push(a);
        data.settings.openingBalance=Math.round(data.accounts.reduce((sum,x)=>sum+x.openingBalance,0)*100)/100;
        dialog.close();refresh();toast('Conta salva.')
      }else if(form.id==='category-form'){
        const old=data.categories.find(c=>c.id===editId),kind=old?.kind||f.kind,name=f.name?.trim();
        if(!name||!['income','expense'].includes(kind)){toast('Revise a categoria.');return}
        if(data.categories.some(c=>c.id!==editId&&c.kind===kind&&c.name.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR'))){toast('Já existe uma categoria com esse nome e tipo.');return}
        const c={id:editId||uid(),name:name.slice(0,60),kind,image:safeImage(dialog.dataset.iconData)};
        if(editId){const idx=data.categories.findIndex(x=>x.id===editId);if(idx<0)return;data.categories[idx]=c}else data.categories.push(c);
        dialog.close();refresh();toast('Categoria salva.')
      }
    });
    app.addEventListener('change',e=>{
      if(e.target.id==='mobile-month-picker'&&monthRE.test(e.target.value)){selectedMonth=e.target.value;render()}
      else if(e.target.id==='wish-sort'){wishSort=e.target.value;render()}
      else if(e.target.id==='statement-sort'){statementSort=e.target.value;render()}
      else if(e.target.id==='statement-status'){statementStatus=e.target.value;render()}
    });
    app.addEventListener('submit',e=>{if(e.target.id!=='settings-form')return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!monthRE.test(f.openingMonth)){toast('Mês-base inválido.');return}data.settings.openingMonth=f.openingMonth;refresh();toast('Mês-base salvo.')});
    document.getElementById('bank-csv-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>1024*1024){toast('CSV acima de 1 MB.');return}try{const rows=parseBankCSV(await file.text());if(!rows.length){toast('Nenhuma movimentação válida encontrada.');return}const existing=new Set(data.bankInbox.map(x=>x.fingerprint));let added=0;for(const x of rows){const fingerprint=[x.date,x.description.toLowerCase().replace(/\s+/g,' '),x.amount,x.bankType,x.bankTime].join('|');if(existing.has(fingerprint))continue;existing.add(fingerprint);data.bankInbox.push({id:uid(),...x,accountId:data.accounts[0].id,categoryId:'',status:'pending',fingerprint,entryId:''});added++}refresh();toast(added+' movimentação(ões) importada(s) para revisão.')}catch(err){toast(err.message||'Erro ao importar CSV.')}});
    document.getElementById('backup-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>5*1024*1024){toast('Backup acima do limite de 5 MB.');return}try{const parsed=normalizeData(JSON.parse(await file.text()));if(!confirm(`Importar ${parsed.entries.length} lançamentos e ${parsed.cards.length} cartões? Isso SUBSTITUIRÁ os dados atuais da sua conta online.`))return;data=parsed;selectedMonth=thisMonth;view='overview';search='';refresh();toast('Backup importado com sucesso.')}catch(err){toast(`Não foi possível importar: ${err.message||'arquivo inválido'}`)}});
    window.VerdeCloud.start({load:remote=>{data=normalizeData(remote);monthCache.clear();render()},initial:()=>{data=defaultData();monthCache.clear();render();return data},notice:toast});
  })();
  </script>
<script>
  if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(err=>console.warn("Instalação offline indisponível:",err)));
</script>
