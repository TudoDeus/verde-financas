    const incomeCategories=['Salário','Renda extra','Rendimentos','Reembolso','Outros'];

    const defaultData=()=>({version:2,settings:{openingBalance:0,openingMonth:`${today.getFullYear()}-01`,carryover:true},accounts:[{id:'main',name:'Conta principal',openingBalance:0,image:null}],categories:standardCategories(),cards:[],entries:[],paidInvoices:{},entryStatuses:{}});
    function normalizeData(raw){
      if(!raw||typeof raw!=='object'||!Array.isArray(raw.cards)||!Array.isArray(raw.entries))throw Error('Formato de backup inválido.');
      if(raw.cards.length>250||raw.entries.length>10000||(raw.accounts?.length||0)>100||(raw.categories?.length||0)>300)throw Error('Arquivo acima dos limites de segurança.');

      const seen=new Set();

          seen.add(String(c.id));return {id:String(c.id).slice(0,100),name:String(c.name).trim().slice(0,60),kind:c.kind,image:safeImage(c.image)};
        });
      }
      const categories=base.categories;seen.clear();
      for(const kind of ['income','expense'])if(!categories.some(c=>c.kind===kind))categories.push(standardCategories().find(c=>c.kind===kind));

        if(!c||typeof c.name!=='string'||!c.name.trim()||!c.id||seen.has(String(c.id)))throw Error('Há cartões inválidos ou duplicados.');
        seen.add(String(c.id));return {id:String(c.id).slice(0,100),name:c.name.trim().slice(0,80),brand:String(c.brand||'Crédito').slice(0,30),limit:Math.min(Math.max(Number(c.limit)||0,0),1e12),closingDay:Math.min(Math.max(Math.floor(Number(c.closingDay)||1),1),31),dueDay:Math.min(Math.max(Math.floor(Number(c.dueDay)||1),1),31),color:['green','navy','purple','black','coral'].includes(c.color)?c.color:'green',payAccountId:accountIDs.has(String(c.payAccountId))?String(c.payAccountId):base.accounts[0].id,image:safeImage(c.image)};

      base.entries=raw.entries.map(e=>{
        if(!e||!e.id||seen.has(String(e.id))||!dateRE.test(e.date)||!Number.isFinite(Number(e.amount))||Number(e.amount)<=0||Number(e.amount)>1e12||!['income','expense'].includes(e.kind)||typeof e.description!=='string'||!e.description.trim())throw Error('Há lançamentos inválidos ou duplicados.');
        seen.add(String(e.id));const method=e.method==='credit'?'credit':'account';const repeat=['once','monthly','installments'].includes(e.repeat)?e.repeat:'once';
        if(method==='credit'&&!cardIDs.has(String(e.cardId)))throw Error('Há lançamentos associados a cartões inexistentes.');
        if(e.kind==='income'&&method==='credit')throw Error('Receitas não podem ser lançadas no cartão.');
        let category=categories.find(c=>c.id===e.categoryId&&c.kind===e.kind);

        if(!category){category={id:`legacy-${e.kind}-${categories.length}`,kind:e.kind,name:String(e.category||'Outros').slice(0,60),image:null};categories.push(category)}
        return {id:String(e.id).slice(0,100),description:e.description.trim().slice(0,120),kind:e.kind,amount:Math.round(Number(e.amount)*100)/100,date:e.date,category:category.name,categoryId:category.id,method,accountId:accountIDs.has(String(e.accountId))?String(e.accountId):base.accounts[0].id,cardId:method==='credit'?String(e.cardId):null,repeat,installments:Math.min(Math.max(Math.floor(Number(e.installments)||1),1),MAX_PARCELAS),endMonth:monthRE.test(e.endMonth)?e.endMonth:null,invoiceMode:e.invoiceMode==='manual'&&monthRE.test(e.firstInvoiceMonth)?'manual':'auto',firstInvoiceMonth:monthRE.test(e.firstInvoiceMonth)?e.firstInvoiceMonth:null};

      base.settings.openingBalance=Math.round(base.accounts.reduce((sum,a)=>sum+a.openingBalance,0)*100)/100;
      if(raw.paidInvoices&&typeof raw.paidInvoices==='object'&&!Array.isArray(raw.paidInvoices)){
        for(const [key,value] of Object.entries(raw.paidInvoices).slice(0,3000))if(key.length<120&&value===true)base.paidInvoices[key]=true;

    let data;

    const app=document.getElementById('app');const dialog=document.getElementById('editor-dialog');

    function invoiceMonth(purchaseDate,card){const purchaseMonth=ym(purchaseDate);const closeMonth=addMonth(purchaseMonth,purchaseDate>clamped(purchaseMonth,card.closingDay)?1:0);return addMonth(closeMonth,card.dueDay<=card.closingDay?1:0)}
    function installmentValue(amount,index,total){const cents=Math.round(amount*100),one=Math.floor(cents/total);return (one+(index===total-1?cents-one*total:0))/100}
    function firstInvoice(e,card){return e.invoiceMode==='manual'&&monthRE.test(e.firstInvoiceMonth)?e.firstInvoiceMonth:ym(e.date)}
    function entriesForMonth(month){
      const rows=[],map=cardsById(),categoryMap=categoriesById(),accountMap=accountsById();

      }

    }
    const monthCache=new Map();
    function monthStats(month){if(monthCache.has(month))return monthCache.get(month);const rows=entriesForMonth(month);let income=0,outgo=0,credit=0;const perCard={};for(const r of rows){if(r.kind==='income')income+=r.amount;else{outgo+=r.amount;if(r.method==='credit'){credit+=r.amount;perCard[r.cardId]=(perCard[r.cardId]||0)+r.amount}}}const result={rows,income:Math.round(income*100)/100,outgo:Math.round(outgo*100)/100,credit:Math.round(credit*100)/100,net:Math.round((income-outgo)*100)/100,perCard};monthCache.set(month,result);return result}
    function accountBalanceThrough(accountId,month){if(month<data.settings.openingMonth)return null;const account=data.accounts.find(a=>a.id===accountId);if(!account)return null;let result=account.openingBalance;const count=monthsBetween(data.settings.openingMonth,month);if(count>1200)return null;for(let i=0;i<=count;i++)for(const r of monthStats(addMonth(data.settings.openingMonth,i)).rows)if(r.accountId===accountId)result+=r.kind==='income'?r.amount:-r.amount;return Math.round(result*100)/100}
    function balanceThrough(month){if(month<data.settings.openingMonth)return null;let result=data.accounts.reduce((sum,a)=>sum+a.openingBalance,0);const count=monthsBetween(data.settings.openingMonth,month);if(count>1200)return null;for(let i=0;i<=count;i++)result+=monthStats(addMonth(data.settings.openingMonth,i)).net;return Math.round(result*100)/100}

    const navItems=[['overview','dashboard','Visão geral'],['transactions','receipt','Lançamentos'],['cards','card','Cartões'],['accounts','wallet','Contas'],['forecast','chart','Planejamento'],['settings','settings','Ajustes']];
    function navButton([id,ico,label]){return `<button class="nav-btn ${view===id?'active':''}" data-view="${id}" aria-current="${view===id?'page':'false'}">${icon(ico)}<span>${label}</span></button>`}
    function renderShell(content){return `<div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-symbol">${icon('chart',22)}</span>verde<span class="brand-dot">.</span></div><div class="side-caption">Seu espaço</div><nav class="nav-group" aria-label="Navegação principal">${navItems.map(navButton).join('')}</nav><div class="side-bottom"><div class="side-message">${icon('shield',22)}<div style="margin-top:8px"><strong>Seus dados no seu controle.</strong></div><p>Dados sincronizados com sua conta. Faça backups regularmente.</p></div><button class="button secondary small" type="button" onclick="window.VerdeCloud.signOut()">Sair da conta</button><div class="side-foot">VERDE FINANÇAS • VERSÃO 2.2</div></div></aside><main class="main"><div class="topbar"><span class="crumb">FINANÇAS PESSOAIS / ${esc(navItems.find(n=>n[0]===view)?.[2]||'')}</span><span class="date-badge">${icon('calendar',13)} ${esc(new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).format(today))}</span></div>${content}</main><nav class="mobile-nav" aria-label="Navegação móvel">${navItems.map(([id,ico,label])=>`<button data-view="${id}" class="${view===id?'active':''}" aria-label="${label}" aria-current="${view===id?'page':'false'}">${icon(ico)}<span>${label}</span></button>`).join('')}</nav></div>`}
    function pageHeader(title,desc,button=true){return `<div class="page-title"><div><h1>${title}</h1><p>${desc}</p></div>${button?`<button class="button primary" data-action="add-entry">${icon('plus')} Novo lançamento</button>`:''}</div>`}
    function monthSelector(){return `<div class="month-control" aria-label="Mês selecionado"><button data-action="prev-month" aria-label="Mês anterior">${icon('chevLeft')}</button><strong>${esc(monthLabel(selectedMonth))}</strong><button data-action="next-month" aria-label="Próximo mês">${icon('chevRight')}</button></div>`}
    function metric(title,value,description,ico,clazz,amountClass=''){return `<section class="panel metric"><div class="metric-head"><span>${title}</span><span class="metric-icon ${clazz}">${icon(ico)}</span></div><div class="metric-value ${amountClass}">${money(value)}</div><div class="metric-description">${description}</div></section>`}
    function rowHTML(r){const installment=r.count?`<span class="pill">${r.index}/${r.count} parcela${r.count===1?'':'s'}</span>`:'';const recurrence=r.repeat==='monthly'?'<span class="pill fixed">Fixo</span>':'';const credit=r.method==='credit'?`<span class="pill credit">${esc(r.cardName||'Cartão')}</span>`:'';return `<div class="entry-row">${entityIcon(r.categoryImage,r.method==='credit'?'card':r.kind==='income'?'arrowDown':'arrowUp')}<div class="entry-body"><div class="entry-name" title="${esc(r.description)}">${esc(r.description)}</div><div class="entry-detail"><span>${showDate(r.date)}</span><span>${esc(r.category)}</span><span>${esc(r.accountName||'')}</span>${credit}${installment}${recurrence}<label class="status-inline">Status <select class="status-picker" data-id="${esc(r.id)}" data-month="${esc(r.billMonth)}" aria-label="Status de ${esc(r.description)}">${options([['pendente','Pendente'],['reservado','Reservado'],['pago','Pago']],r.status)}</select></label></div></div><div class="entry-right"><span class="entry-amount ${r.kind==='income'?'positive':'negative'}">${r.kind==='income'?'+':'−'} ${money(r.amount)}</span><button class="edit-icon" data-action="edit-entry" data-id="${esc(r.id)}" aria-label="Editar ${esc(r.description)}" title="Editar regra do lançamento">${icon('edit')}</button></div></div>`}
    function emptyHTML(title,desc,buttonAction='add-entry',buttonLabel='Adicionar lançamento'){return `<div class="empty"><div class="empty-icon">${icon('coins')}</div><strong>${title}</strong><p>${desc}</p>${buttonAction?`<button class="button secondary small" data-action="${buttonAction}">${buttonLabel}</button>`:''}</div>`}
    function miniCard(c){return `<div class="mini-card ${esc(c.color)}"><span style="display:flex;align-items:center;gap:6px">${safeImage(c.image)?`<img src="${esc(c.image)}" alt="" style="height:20px;width:20px;object-fit:cover;border-radius:5px">`:''}${esc(c.brand)}</span><span>${esc(c.name)}</span></div>`}
    function chartSVG(months){
      const points=months.map(m=>balanceThrough(m)??0),W=800,H=230,padTop=20,padBottom=34,padLeft=30,padRight=12;const min=Math.min(0,...points),max=Math.max(0,...points);const spread=max-min||1;const nice=spread*.13;const lo=min-nice,hi=max+nice;const x=i=>padLeft+i*(W-padLeft-padRight)/Math.max(months.length-1,1);const y=v=>padTop+(hi-v)/(hi-lo)*(H-padTop-padBottom);
      const line=points.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');const area=`${line} L${x(points.length-1)},${H-padBottom} L${x(0)},${H-padBottom} Z`;
      const grid=Array.from({length:4},(_,i)=>{const val=lo+(hi-lo)*(3-i)/3,yy=y(val);return `<line x1="${padLeft}" y1="${yy}" x2="${W-padRight}" y2="${yy}" stroke="#eaf0eb" stroke-dasharray="4 5"/><text x="1" y="${yy-5}">${esc(compact(val))}</text>`}).join('');
      return `<svg class="forecast-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de projeção de saldo acumulado para os próximos ${months.length} meses"><defs><linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#1dc682" stop-opacity=".22"/><stop offset="1" stop-color="#1dc682" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#chartFill)"/><path d="${line}" fill="none" stroke="#12ab6e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${points.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="#0da66b" stroke-width="2"><title>${esc(monthLabel(months[i]))}: ${money(v)}</title></circle>`).join('')}${months.map((m,i)=>i%Math.max(1,Math.ceil(months.length/6))===0||i===months.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(shortMonth(m))}</text>`:'').join('')}</svg>`;
    }
    function overview(){
      const m=monthStats(selectedMonth),balance=balanceThrough(selectedMonth),showCarry=data.settings.carryover;const display=showCarry?balance:m.net;
      const latest=m.rows.slice(0,5);const months=Array.from({length:6},(_,i)=>addMonth(selectedMonth,i));
      return `${pageHeader('Visão geral','Um panorama do seu dinheiro, hoje e nos próximos meses.')}<div class="control-row">${monthSelector()}<span class="muted">${selectedMonth===thisMonth?'Você está vendo o mês atual.':'Visualizando o período selecionado.'} <button class="subtle-link" data-action="current-month">Ir para hoje</button></span></div>${showCarry&&balance===null?'<div class="warning">O mês escolhido está antes do saldo inicial. Ajuste o mês-base em Ajustes para calcular o acumulado.</div>':''}<section class="balance-hero"><div class="hero-content"><div class="hero-kicker">${icon('wallet',17)} ${showCarry?'Saldo total previsto':'Resultado do mês'}</div><div class="hero-amount">${display===null?'—':money(display)}</div><p class="hero-desc">${showCarry?`Inclui o saldo inicial e as receitas e despesas previstas até ${esc(monthLabel(selectedMonth))}.`:'A diferença entre entradas e saídas previstas somente para este mês.'}</p><div class="hero-actions"><button class="hero-action" data-action="add-entry">${icon('plus')} Adicionar movimento</button><button class="hero-action" data-view="forecast">${icon('chart')} Ver previsão</button></div></div><label class="hero-corner"><input type="checkbox" id="carry-toggle" ${showCarry?'checked':''}> Somar meses anteriores</label></section><div class="grid metrics">${metric('Entradas do mês',m.income,'Receitas previstas','arrowDown','green','positive')}${metric('Saídas do mês',m.outgo,'Contas + faturas','arrowUp','red','negative')}${metric('No cartão',m.credit,'Incluído nas saídas','card','blue')}</div><div class="grid two"><section class="panel"><div class="panel-header"><div><h2>Projeção de saldo</h2><p>Próximos 6 meses • saldo acumulado</p></div><span class="chart-key"><i class="key-dot"></i> Previsão</span></div>${chartSVG(months)}<div class="legend"><span>${icon('info',14)} Considera recorrências, parcelas e faturas agendadas.</span></div></section><section class="panel"><div class="panel-header"><div><h2>Últimos movimentos do mês</h2><p>Lançamentos e parcelas previstos</p></div><button class="subtle-link" data-view="transactions">Ver todos →</button></div>${latest.length?`<div class="item-list">${latest.map(rowHTML).join('')}</div>`:emptyHTML('Tudo começa com um lançamento','Adicione uma receita ou despesa para começar a organizar suas finanças.')}</section></div><div class="grid two section-space"><section class="panel"><div class="panel-header"><div><h2>Seus cartões</h2><p>Faturas previstas em ${esc(monthLabel(selectedMonth))}</p></div><button class="subtle-link" data-view="cards">Gerenciar →</button></div>${data.cards.length?data.cards.slice(0,3).map(c=>`<div class="card-small">${miniCard(c)}<div class="details"><strong>${esc(c.name)}</strong><p>Fatura prevista</p><em>${money(m.perCard[c.id]||0)}</em></div></div>`).join(''):emptyHTML('Nenhum cartão cadastrado','Cadastre um cartão para organizar suas compras e parcelas.','add-card','Adicionar cartão')}</section><section class="panel"><div class="panel-header"><div><h2>Como está o seu mês?</h2><p>Composição das saídas previstas</p></div>${icon('spark',19)}</div>${m.outgo>0?`<div style="font-size:27px;font-weight:850;letter-spacing:-1px">${money(m.outgo)}</div><p class="muted" style="font-size:12px">Total programado para sair neste mês.</p><div class="progress-wrap" style="display:flex"><div class="progress-fill" style="width:${(m.credit/m.outgo*100).toFixed(2)}%"></div><div style="background:#e0e6ef;flex:1"></div></div><div class="legend"><span><i></i> Cartões ${money(m.credit)}</span><span><i style="background:#b5c4d2"></i> Conta ${money(m.outgo-m.credit)}</span></div><div class="tips" style="margin-top:23px">${icon('info',14)} Compras no crédito entram como saída no mês atribuído à parcela, sem contagem dupla.</div>`:emptyHTML('Sem despesas previstas','Suas despesas aparecerão aqui à medida que você cadastrar movimentos.',null)}</section></div>`;
    }
    function filteredRows(){const rows=monthStats(selectedMonth).rows;return rows.filter(r=>(filter==='all'||r.kind===filter)&&`${r.description} ${r.category} ${r.cardName||''}`.toLocaleLowerCase('pt-BR').includes(search.toLocaleLowerCase('pt-BR')))}
    function transactionsList(){const rows=filteredRows();return `<div class="panel-header"><div><h2>Lançamentos do período</h2><p>${rows.length} ocorrência${rows.length===1?'':'s'} encontrada${rows.length===1?'':'s'}</p></div><span class="badge-count">${monthLabel(selectedMonth)}</span></div>${rows.length?`<div class="item-list">${rows.map(rowHTML).join('')}</div>`:emptyHTML('Nenhum lançamento encontrado','Tente mudar os filtros ou registre uma nova receita ou despesa.')}`}
    function transactions(){const m=monthStats(selectedMonth);return `${pageHeader('Lançamentos','Adicione receitas, despesas fixas e compras parceladas.')}<div class="control-row">${monthSelector()}<button class="button secondary small" data-action="current-month">Ir para o mês atual</button></div><div class="grid metrics">${metric('Receitas',m.income,'Previsto no mês','arrowDown','green','positive')}${metric('Despesas',m.outgo,'Inclui cartões','arrowUp','red','negative')}${metric('Resultado',m.net,'Entradas menos saídas','wallet','blue',m.net>=0?'positive':'negative')}</div><div class="list-toolbar"><label class="search-field">${icon('search',17)}<input id="entry-search" value="${esc(search)}" placeholder="Buscar lançamento ou categoria" aria-label="Buscar lançamentos"></label><div class="filter-tabs"><button data-filter="all" class="${filter==='all'?'active':''}">Todos</button><button data-filter="income" class="${filter==='income'?'active':''}">Entradas</button><button data-filter="expense" class="${filter==='expense'?'active':''}">Saídas</button></div></div><section class="panel" id="transaction-list">${transactionsList()}</section><div class="tips section-space"><strong>Como funciona:</strong> lançamentos fixos se repetem mensalmente. Compras parceladas são distribuídas automaticamente; no cartão, começam no mês do registro por padrão. Editar um lançamento altera todas as suas ocorrências. O status Pago/Reservado/Pendente é individual por mês e não altera a projeção.</div>`}
    function cardSummary(c){const m=monthStats(selectedMonth);const fatura=m.perCard[c.id]||0;const percent=c.limit?Math.min(100,fatura/c.limit*100):0;return `<article class="card-detail"><div class="card-tile ${esc(c.color)}"><div class="top"><span class="brand-text" style="display:flex;align-items:center;gap:8px">${safeImage(c.image)?`<img class="card-brand-icon" src="${esc(c.image)}" alt="">`:''}${esc(c.brand)}</span><span class="card-chip" aria-hidden="true"></span></div><div class="bottom"><div class="name">${esc(c.name)}</div><div class="detail">Fechamento dia ${c.closingDay} · Vencimento dia ${c.dueDay}</div></div></div><div class="card-stat"><div><p>Fatura de ${esc(shortMonth(selectedMonth))}</p><strong>${money(fatura)}</strong></div><div style="text-align:right"><p>Limite cadastrado</p><strong>${money(c.limit)}</strong></div></div><div class="progress-wrap"><div class="progress-fill" style="width:${percent}%"></div></div><div class="legend" style="margin-top:7px"><span>Fatura do mês = ${Math.round(percent)}% do limite</span></div><div class="detail-actions"><button class="button secondary small" data-action="edit-card" data-id="${esc(c.id)}">${icon('edit',15)} Editar cartão</button><button class="button ghost small" data-action="delete-card" data-id="${esc(c.id)}">${icon('trash',15)} Excluir</button></div></article>`}
    function cards(){const m=monthStats(selectedMonth);return `${pageHeader('Meus cartões','Controle cada fatura, os vencimentos e as parcelas futuras.',false)}<div class="control-row">${monthSelector()}<button class="button primary" data-action="add-card">${icon('plus')} Novo cartão</button></div>${data.cards.length?`<div class="card-grid">${data.cards.map(cardSummary).join('')}</div><div class="split-heading"><h2>Faturas programadas</h2><span class="muted" style="font-size:11px">Marcação de pagamento para seu acompanhamento</span></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(275px,1fr))">${data.cards.map(c=>`<section class="panel"><div class="panel-header"><h2>${esc(c.name)}</h2>${icon('card',20)}</div>${Array.from({length:4},(_,i)=>{const month=addMonth(selectedMonth,i);const sum=monthStats(month).perCard[c.id]||0;const key=`${c.id}|${month}`;const paid=!!data.paidInvoices[key];return `<div class="bill-row"><div><div class="label">${esc(monthLabel(month))}</div><div class="sub">Vence dia ${c.dueDay}</div></div><div class="right"><strong>${money(sum)}</strong><div>${sum>0?`<button data-action="toggle-paid" data-id="${esc(c.id)}" data-month="${month}">${paid?'<span class="tag-ok">✓ Paga</span>':'Marcar como paga'}</button>`:'<span class="muted" style="font-size:10px">Sem fatura</span>'}</div></div></div>`}).join('')}</section>`).join('')}</div><div class="tips section-space"><strong>Atenção:</strong> a marcação “Paga” é apenas um controle de status. A previsão de saldo já considera a fatura no vencimento e não a desconta novamente. O indicador de limite compara somente a fatura do mês com o limite, não representa o limite efetivamente disponível.</div>`:emptyHTML('Seus cartões, organizados','Cadastre o primeiro cartão com dia de fechamento, vencimento e limite. Depois, registre as compras com suas parcelas.','add-card','Cadastrar cartão')}`}
    function accounts(){return `${pageHeader('Minhas contas','Organize o dinheiro disponível em cada conta e acompanhe o saldo separado.',false)}<div class="control-row">${monthSelector()}<button class="button primary" data-action="add-account">${icon('plus')} Nova conta</button></div><div class="account-grid">${data.accounts.map(a=>{const bal=accountBalanceThrough(a.id,selectedMonth);return `<article class="account-tile"><div class="head">${entityIcon(a.image,'wallet','large')}<div><strong>${esc(a.name)}</strong><div class="account-label">Conta de saldo</div></div></div><div class="balance ${bal===null?'':bal>=0?'positive':'negative'}">${bal===null?'—':money(bal)}</div><div class="desc">Saldo previsto até ${esc(monthLabel(selectedMonth))}</div><div class="actions"><button class="button secondary small" data-action="edit-account" data-id="${esc(a.id)}">${icon('edit',15)} Editar</button><button class="button ghost small" data-action="delete-account" data-id="${esc(a.id)}">${icon('trash',15)} Excluir</button></div></article>`}).join('')}</div><div class="tips section-space"><strong>Como são calculadas:</strong> receitas e despesas à vista afetam a conta escolhida. Compras no cartão são descontadas da conta selecionada para pagamento da fatura, no mês de vencimento. O saldo total é a soma das contas.</div>`}
    function forecast(){const months=Array.from({length:forecastCount},(_,i)=>addMonth(selectedMonth,i));return `${pageHeader('Planejamento futuro','Veja como seus lançamentos de hoje impactam os próximos meses.')}<div class="control-row">${monthSelector()}<div class="filter-tabs" aria-label="Horizonte de projeção"><button data-horizon="6" class="${forecastCount===6?'active':''}">6 meses</button><button data-horizon="12" class="${forecastCount===12?'active':''}">12 meses</button><button data-horizon="24" class="${forecastCount===24?'active':''}">24 meses</button></div></div><section class="panel"><div class="panel-header"><div><h2>Evolução do saldo</h2><p>Saldo inicial + receitas − despesas, incluindo faturas</p></div><span class="chart-key"><i class="key-dot"></i> Acumulado</span></div>${months.some(m=>balanceThrough(m)===null)?'<div class="warning">Parte dos meses está antes do mês-base. Atualize o mês-base nos Ajustes para completar a previsão.</div>':''}${chartSVG(months)}<div class="legend"><span>${icon('info',14)} Valores projetados, sem conexão automática com o banco.</span></div></section><section class="panel section-space"><div class="panel-header"><div><h2>Previsão mês a mês</h2><p>O que entra, sai e sobra com os lançamentos atuais</p></div><span class="badge-count">${forecastCount} meses</span></div><div class="scroll-table"><table class="forecast-table"><thead><tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Cartões inclusos</th><th>Resultado</th><th>Saldo acumulado</th></tr></thead><tbody>${months.map(m=>{const a=monthStats(m),bal=balanceThrough(m);return `<tr><td>${esc(monthLabel(m))}</td><td class="positive">+ ${money(a.income)}</td><td class="negative">− ${money(a.outgo)}</td><td>${money(a.credit)}</td><td class="${a.net>=0?'positive':'negative'}">${money(a.net)}</td><td style="font-weight:850" class="${bal===null?'':bal>=0?'positive':'negative'}">${bal===null?'—':money(bal)}</td></tr>`}).join('')}</tbody></table></div></section><div class="tips section-space"><strong>Previsão inteligente:</strong> as receitas e despesas mensais repetem-se até o fim definido (quando houver). Parcelas são lançadas automaticamente nos meses correspondentes. Compras no crédito aparecem na primeira fatura escolhida e nos meses seguintes. Gastos ainda não registrados não podem ser previstos.</div>`}
    function settings(){return `${pageHeader('Ajustes e categorias','Personalize seus lançamentos e proteja seus registros.',false)}<div class="settings-grid"><section class="panel"><div class="panel-header"><div><h2>Ponto de partida</h2><p>Período inicial do saldo acumulado</p></div>${icon('wallet',20)}</div><form id="settings-form" class="form-grid"><div class="field full"><label for="opening-month">Mês de referência</label><input type="month" id="opening-month" name="openingMonth" required value="${esc(data.settings.openingMonth)}"><span class="hint">Para alterar o saldo inicial, edite cada conta na aba Contas.</span></div><div class="field full"><button class="button primary" type="submit">${icon('check')} Salvar mês-base</button></div></form><button class="button secondary small section-space" data-view="accounts">${icon('wallet',15)} Gerenciar contas</button></section><section class="panel"><div class="panel-header"><div><h2>Backup dos seus dados</h2><p>Exporte e importe contas, categorias e lançamentos</p></div>${icon('shield',20)}</div><div class="tips"><strong>Importante:</strong> seus dados ficam somente neste navegador. O backup permite levar os registros e as imagens para outro dispositivo, sem sincronização automática.</div><div class="settings-actions"><button class="button primary" data-action="export">${icon('download')} Baixar backup</button><button class="button secondary" data-action="import">${icon('upload')} Importar backup</button></div><p class="muted" style="font-size:11px;margin-top:18px">Importar substitui os dados atuais após sua confirmação.</p></section><section class="panel"><div class="panel-header"><div><h2>Ferramentas úteis</h2><p>Exemplos e exportação de planilhas</p></div>${icon('spark',20)}</div><div class="settings-actions"><button class="button secondary" data-action="demo">${icon('plus')} Adicionar dados de exemplo</button><button class="button secondary" data-action="csv">${icon('download')} Exportar mês em CSV</button></div></section><section class="panel"><div class="panel-header"><div><h2>Como são calculadas as faturas</h2><p>Previsão transparente e editável</p></div>${icon('info',20)}</div><div class="tips"><strong>Primeira fatura:</strong> no mês do registro por padrão, ou escolhida manualmente.<br><strong>Parcelas:</strong> aparecem mês a mês, começando na primeira fatura definida.<br><strong>Saldo total:</strong> soma dos saldos das contas, já considerando faturas previstas.</div></section></div><section class="panel section-space"><div class="panel-header"><div><h2>Suas categorias</h2><p>Crie, renomeie e adicione imagens personalizadas a receitas e despesas.</p></div><button class="button primary small" data-action="add-category">${icon('plus',15)} Nova categoria</button></div><div class="split-heading"><h2 style="font-size:14px">Despesas</h2><span class="badge-count">${data.categories.filter(c=>c.kind==='expense').length}</span></div><div class="category-list">${data.categories.filter(c=>c.kind==='expense').map(categoryHTML).join('')}</div><div class="split-heading"><h2 style="font-size:14px">Receitas</h2><span class="badge-count">${data.categories.filter(c=>c.kind==='income').length}</span></div><div class="category-list">${data.categories.filter(c=>c.kind==='income').map(categoryHTML).join('')}</div></section>`}
    function categoryHTML(c){return `<div class="category-row">${entityIcon(c.image,'receipt','small')}<span class="name">${esc(c.name)}</span><button class="edit-icon" data-action="edit-category" data-id="${esc(c.id)}" title="Editar categoria" aria-label="Editar ${esc(c.name)}">${icon('edit',16)}</button><button class="edit-icon" data-action="delete-category" data-id="${esc(c.id)}" title="Excluir categoria" aria-label="Excluir ${esc(c.name)}">${icon('trash',15)}</button></div>`}
    function render(){const content={overview,transactions,cards,accounts,forecast,settings}[view]();app.innerHTML=renderShell(content)}

    async function readIcon(file){
      if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024)throw Error('Escolha um PNG, JPG ou WebP de até 2 MB.');
      let bitmap;
      if(typeof createImageBitmap==='function')bitmap=await createImageBitmap(file);
      else bitmap=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Imagem inválida.'))};img.src=url});
      const canvas=document.createElement('canvas');canvas.width=128;canvas.height=128;
      const ctx=canvas.getContext('2d');const size=Math.min(128/bitmap.width,128/bitmap.height);const w=Math.max(1,Math.round(bitmap.width*size)),h=Math.max(1,Math.round(bitmap.height*size));
      ctx.clearRect(0,0,128,128);ctx.drawImage(bitmap,(128-w)/2,(128-h)/2,w,h);bitmap.close?.();
      const uri=canvas.toDataURL('image/png');if(!safeImage(uri))throw Error('Não foi possível processar essa imagem.');return uri;
    }

        if(f.method==='credit'&&f.invoiceMode==='manual'&&(!monthRE.test(f.firstInvoiceMonth)||f.firstInvoiceMonth<ym(f.date))){toast('A primeira fatura deve ser igual ou posterior ao mês da compra.');return}
        const accountId=data.accounts.some(a=>a.id===f.accountId)?f.accountId:data.accounts[0].id;
        const record={id:editId||uid(),description:f.description.trim(),kind:f.kind,amount,date:f.date,category:category.name,categoryId:category.id,method:f.method,accountId,cardId:f.method==='credit'?f.cardId:null,repeat:f.repeat,installments:f.repeat==='installments'?Number(f.installments):1,endMonth:f.repeat==='monthly'?(f.endMonth||null):null,invoiceMode:f.method==='credit'&&f.invoiceMode==='manual'?'manual':'auto',firstInvoiceMonth:f.method==='credit'&&f.invoiceMode==='manual'?f.firstInvoiceMonth:null};
        if(!record.description||!dateRE.test(record.date)||!Number.isInteger(record.installments)||record.installments<1||record.installments>MAX_PARCELAS){toast('Revise os campos do lançamento.');return}
        if(editId){const idx=data.entries.findIndex(r=>r.id===editId);if(idx<0)return;data.entries[idx]=record}else data.entries.push(record);
        dialog.close();refresh();toast(editId?'Lançamento atualizado.':'Lançamento adicionado.')
      }else if(form.id==='card-form'){
        const c={id:editId||uid(),name:f.name.trim(),brand:f.brand,limit:Math.round(Number(f.limit)*100)/100,closingDay:Number(f.closingDay),dueDay:Number(f.dueDay),color:f.color,payAccountId:f.payAccountId,image:safeImage(dialog.dataset.iconData)};
        if(!c.name||!Number.isFinite(c.limit)||c.limit<0||![c.closingDay,c.dueDay].every(n=>Number.isInteger(n)&&n>=1&&n<=31)||!data.accounts.some(a=>a.id===c.payAccountId)){toast('Revise os dados do cartão.');return}
        if(editId){const idx=data.cards.findIndex(r=>r.id===editId);if(idx<0)return;data.cards[idx]=c}else data.cards.push(c);
        dialog.close();refresh();toast(editId?'Cartão atualizado.':'Cartão cadastrado.')
      }else if(form.id==='account-form'){
        const amount=Math.round(Number(f.openingBalance)*100)/100;if(!f.name?.trim()||!Number.isFinite(amount)||Math.abs(amount)>1e12){toast('Revise os dados da conta.');return}
        const a={id:editId||uid(),name:f.name.trim().slice(0,80),openingBalance:amount,image:safeImage(dialog.dataset.iconData)};
        if(editId){const idx=data.accounts.findIndex(x=>x.id===editId);if(idx<0)return;data.accounts[idx]=a}else data.accounts.push(a);
        data.settings.openingBalance=Math.round(data.accounts.reduce((sum,x)=>sum+x.openingBalance,0)*100)/100;
        dialog.close();refresh();toast('Conta salva.')
      }else if(form.id==='category-form'){
        const old=data.categories.find(c=>c.id===editId),kind=old?.kind||f.kind,name=f.name?.trim();
        if(!name||!['income','expense'].includes(kind)){toast('Revise a categoria.');return}
        if(data.categories.some(c=>c.id!==editId&&c.kind===kind&&c.name.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR'))){toast('Já existe uma categoria com esse nome e tipo.');return}
        const c={id:editId||uid(),name:name.slice(0,60),kind,image:safeImage(dialog.dataset.iconData)};
        if(editId){const idx=data.categories.findIndex(x=>x.id===editId);if(idx<0)return;data.categories[idx]=c}else data.categories.push(c);
        dialog.close();refresh();toast('Categoria salva.')
      }
    });
    app.addEventListener('submit',e=>{if(e.target.id!=='settings-form')return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!monthRE.test(f.openingMonth)){toast('Mês-base inválido.');return}data.settings.openingMonth=f.openingMonth;refresh();toast('Mês-base salvo.')});
    document.getElementById('backup-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>5*1024*1024){toast('Backup acima do limite de 5 MB.');return}try{const parsed=normalizeData(JSON.parse(await file.text()));if(!confirm(`Importar ${parsed.entries.length} lançamentos e ${parsed.cards.length} cartões? Isso SUBSTITUIRÁ os dados atuais da sua conta online.`))return;data=parsed;selectedMonth=thisMonth;view='overview';search='';refresh();toast('Backup importado com sucesso.')}catch(err){toast(`Não foi possível importar: ${err.message||'arquivo inválido'}`)}});
    window.VerdeCloud.start({load:remote=>{data=normalizeData(remote);monthCache.clear();render()},initial:()=>{data=defaultData();monthCache.clear();render();return data},notice:toast});
  })();
  </script>
</body>
